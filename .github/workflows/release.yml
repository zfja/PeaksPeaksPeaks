name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Bundle Qt libraries
        run: macdeployqt build/PeaksPeaksPeaks.app -always-overwrite

      - name: Create DMG
        run: |
          hdiutil create -volname "PeaksPeaksPeaks" \
            -srcfolder build/PeaksPeaksPeaks.app \
            -ov -format UDZO \
            PeaksPeaksPeaks-macos.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: PeaksPeaksPeaks-macos.dmg

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect and deploy Qt runtime
        shell: cmd
        run: |
          mkdir package
          copy build\Release\PeaksPeaksPeaks.exe package\
          windeployqt --release --no-translations package\PeaksPeaksPeaks.exe

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath PeaksPeaksPeaks-windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: PeaksPeaksPeaks-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PeaksPeaksPeaks-macos.dmg
            dist/PeaksPeaksPeaks-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
