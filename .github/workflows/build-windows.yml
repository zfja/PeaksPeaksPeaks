name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR%

      - name: Build
        run: cmake --build build --config Release

      - name: Collect and deploy Qt runtime
        shell: cmd
        run: |
          mkdir package
          copy build\Release\PeaksPeaksPeaks.exe package\
          windeployqt --release --no-translations package\PeaksPeaksPeaks.exe

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path package\* -DestinationPath PeaksPeaksPeaks-windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PeaksPeaksPeaks-windows
          path: PeaksPeaksPeaks-windows.zip
