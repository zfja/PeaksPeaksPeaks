name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Collect and deploy Qt runtime
        shell: cmd
        run: |
          mkdir package
          copy build\Release\PeaksPeaksPeaks.exe package\
          windeployqt --release --no-translations package\PeaksPeaksPeaks.exe

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: PeaksPeaksPeaks-windows
          path: package
